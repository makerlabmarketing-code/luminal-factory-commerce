name: Fix generated type snapshot

on:
  push:
    branches:
      - feat/phase6-saved-addresses-ui

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase6-saved-addresses-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair generated snapshot and remove temporary workflow
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/lib/supabase/database.types.ts';
          const before = fs.readFileSync(path, 'utf8');
          const needle = '          amount_minor?: string | number\n          authorized_at?: string | null';
          if (!before.includes(needle)) throw new Error('Expected generated-type repair target was not found.');
          fs.writeFileSync(path, before.replace(needle, '          amount_minor?: number\n          authorized_at?: string | null'));
          fs.rmSync('.github/workflows/fix-generated-type.yml');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/supabase/database.types.ts .github/workflows/fix-generated-type.yml
          git commit -m 'Align generated payment types with Production'
          git push origin HEAD:feat/phase6-saved-addresses-ui

name: Security lockfile remediation

on:
  push:
    branches:
      - chore/security-dependency-remediation
    paths:
      - .github/workflows/security-lockfile-remediation.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/security-dependency-remediation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh vulnerable dependency set
        run: |
          npm install next@16.3.4 eslint-config-next@16.3.4 --save-exact
          npm audit fix
      - name: Validate remediated tree
        run: |
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run typecheck
          npm test
          npm run security:static
          npm run build
      - name: Commit validated lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/security-lockfile-remediation.yml
          git commit -m "Remediate vulnerable runtime dependencies"
          git push origin HEAD:chore/security-dependency-remediation
